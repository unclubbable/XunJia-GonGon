  ticket-service:
    image: centos-java:1.0
    container_name: ticket-service
    restart: always
    privileged: true
    volumes:
    - /opt/service-weifuwu/jar/:/opt/jar/
    - /opt/service-weifuwu/log/:/opt/log/
    ports:
      - "8091:8091"
    command: ["/bin/sh", "-c", "/opt/jdk-17/bin/java -jar /opt/jar/service-ticket-1.0-SNAPSHOT.jar &>> /opt/log/ticket.log"]
  ai-service:
    image: centos-java:1.0
    container_name: ai-service
