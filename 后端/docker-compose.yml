    container_name: order-service
    restart: always
    privileged: true
    volumes:
    - /opt/service-weifuwu/jar/:/opt/jar/
    - /opt/service-weifuwu/log/:/opt/log/
    ports:
      - "8087:8087"
    command: ["/bin/sh", "-c", "/opt/jdk-17/bin/java -jar /opt/jar/service-order-1.0-SNAPSHOT.jar &>> /opt/log/order.log"]
  price-service:
