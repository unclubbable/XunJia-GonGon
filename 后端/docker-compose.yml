    container_name: price-service
    restart: always
    privileged: true
    volumes:
    - /opt/service-weifuwu/jar/:/opt/jar/
    - /opt/service-weifuwu/log/:/opt/log/
    ports:
      - "8084:8084"
    command: ["/bin/sh", "-c", "/opt/jdk-17/bin/java -jar /opt/jar/service-price-1.0-SNAPSHOT.jar &>> /opt/log/price.log"]
  websocket-service:
    image: centos-java:1.0
