server:
  port: 9000

spring:
  config:
    import: optional:classpath:application-local.yml
  main:
    allow-circular-references: true
  application:
    name: service-websocket
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.220.128:8848
    sentinel:
      transport:
        dashboard: 192.168.220.128:8090
      http-method-specify: true
  redis:
    host: 192.168.220.128
    port: 6379
    password: CHANGE_ME
    database: 0
  # 本服务不访问业务库；去掉无用 datasource，避免误连
logging:
  level:
    com.taxi.websocket: debug
  pattern:
    dateformat: HH:mm:ss:SSS
