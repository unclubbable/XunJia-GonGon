logging:
  level:
    com.taxi.order: debug
  pattern:
    dateformat: HH:mm:ss:SSS
seata:
  data-source-proxy-mode: AT
  registry:
    type: nacos
    nacos:
      server-addr: 8.140.211.132:8848
      namespace: ""
      group: DEFAULT_GROUP
      application: seata-server
      username: nacos
      password: CHANGE_ME
  tx-service-group: order
  service:
    vgroup-mapping:
      order: "default"
knife4j:
  enable: true
  openapi:
    group:
      default:
        api-rule-resources:
          - com.taxi.order

# 支付宝沙箱（真实密钥写在 application-local.yml）
alipay:
  app-id: CHANGE_ME
  private-key: CHANGE_ME
  alipay-public-key: CHANGE_ME
  server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: http://127.0.0.1:7071/passenger-user/alipay/notify
  auth-token: CHANGE_ME
